name: ci

on:
  push:
    branches: [main]
  pull_request:

# least privilege: CI only reads the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate configs
        run: |
          python -c "import glob; from freewidth.config import load_config; [load_config(p) for p in glob.glob('configs/kaggle_*.yaml') + glob.glob('configs/mac_*.yaml') + ['configs/smoke.yaml']]"
          python -c "import glob; from freewidth.engine import EngineConfig; [EngineConfig.from_yaml(p) for p in glob.glob('configs/engine_*.yaml')]"
      - name: Tests
        run: python -m pytest -q
      - name: Smoke pipeline
        run: python -m freewidth smoke --out runs/smoke

  hf-cpu:
    # the real transformers path on a tiny random model (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt transformers tokenizers
      - name: HF backend + live engine tests
        run: python -m pytest -q tests/test_hf_backend.py
