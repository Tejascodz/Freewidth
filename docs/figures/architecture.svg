<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>FreeWidth overlap: a small model samples a free-width wave on GPU 0 while a larger model verifies each finished answer on GPU 1</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="1160" height="400" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="16" y="40" width="660" height="160" rx="10" fill="#f6fbf8" stroke="#d6eee3"/>
  <rect x="16" y="214" width="660" height="124" rx="10" fill="#f5f8fd" stroke="#d5e3f6"/>
  <text x="34" y="66" font-size="13" font-weight="700" fill="#202124">GPU 0</text>
  <text x="34" y="86" font-size="12.5" fill="#1a8f63">Qwen3.5-0.8B</text>
  <text x="34" y="112" font-size="11" fill="#5f6368">one wave of</text>
  <text x="34" y="127" font-size="11" fill="#5f6368">free-width samples</text>
  <text x="34" y="142" font-size="11" fill="#5f6368">(16 on a T4)</text>
  <text x="34" y="240" font-size="13" font-weight="700" fill="#202124">GPU 1</text>
  <text x="34" y="260" font-size="12.5" fill="#1f63b8">Qwen3.5-4B</text>
  <text x="34" y="286" font-size="11" fill="#5f6368">one prefill pass</text>
  <text x="34" y="301" font-size="11" fill="#5f6368">per finished answer</text>

  <!-- sample rows: three finish, then the wave stops and the rest are cut -->
  <g stroke="#1baf7a" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="72" x2="360" y2="72"/>
    <line x1="200" y1="88" x2="400" y2="88"/>
    <line x1="200" y1="104" x2="440" y2="104"/>
    <line x1="200" y1="120" x2="476" y2="120"/>
    <line x1="200" y1="136" x2="476" y2="136"/>
    <line x1="200" y1="152" x2="476" y2="152"/>
    <line x1="200" y1="168" x2="476" y2="168"/>
    <line x1="200" y1="184" x2="476" y2="184"/>
  </g>
  <g stroke="#c4c7c5" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round">
    <line x1="490" y1="120" x2="620" y2="120"/><line x1="490" y1="136" x2="580" y2="136"/>
    <line x1="490" y1="152" x2="650" y2="152"/><line x1="490" y1="168" x2="560" y2="168"/>
    <line x1="490" y1="184" x2="640" y2="184"/>
  </g>
  <text x="500" y="106" font-size="10.5" fill="#80868b">remaining tokens never decoded</text>
  <g fill="#1baf7a" stroke="#ffffff" stroke-width="2">
    <circle cx="360" cy="72" r="6"/><circle cx="400" cy="88" r="6"/><circle cx="440" cy="104" r="6"/>
  </g>
  <g font-size="11" font-weight="600" fill="#1a8f63">
    <text x="372" y="76">42</text><text x="412" y="92">38</text><text x="452" y="108">42</text>
  </g>

  <!-- accept point -->
  <line x1="483" y1="52" x2="483" y2="196" stroke="#202124" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="477" y="60" font-size="11" font-weight="700" fill="#202124" text-anchor="end">accept 42, stop the wave</text>

  <!-- verifications: dotted handoff from each finish to a P(Yes) check -->
  <g stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="360" y1="78" x2="360" y2="232"/><line x1="400" y1="94" x2="400" y2="232"/>
    <line x1="440" y1="110" x2="440" y2="232"/>
  </g>
  <g font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="342" y="234" width="36" height="22" rx="5" fill="#2a78d6"/><text x="360" y="249" fill="#fff">0.98</text>
    <rect x="382" y="234" width="36" height="22" rx="5" fill="#eb6834"/><text x="400" y="249" fill="#fff">0.12</text>
    <rect x="422" y="234" width="36" height="22" rx="5" fill="#2a78d6"/><text x="440" y="249" fill="#fff">0.97</text>
  </g>
  <text x="200" y="249" font-size="11" fill="#5f6368">P(Yes) per answer</text>
  <text x="400" y="272" font-size="10.5" fill="#c4521f" text-anchor="middle">vetoed</text>

  <!-- escalation path (not taken in this example) -->
  <rect x="300" y="296" width="360" height="22" rx="11" fill="none" stroke="#2a78d6" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="480" y="311" font-size="10.5" fill="#5f6368" text-anchor="middle">on a trigger: 4B decodes its own answers in parallel</text>

  <!-- time axis -->
  <line x1="200" y1="366" x2="660" y2="366" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="386" font-size="11" fill="#5f6368">time within one question</text>

  <!-- decision -->
  <line x1="680" y1="190" x2="716" y2="190" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="722" y="66" width="268" height="248" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="742" y="96" font-size="14" font-weight="700" fill="#202124">Decide</text>
  <circle cx="748" cy="126" r="5" fill="#1baf7a"/>
  <text x="762" y="130" font-size="12" font-weight="600" fill="#202124">Accept</text>
  <text x="762" y="147" font-size="11" fill="#5f6368">2+ matching answers, P(Yes) ≥ 0.95</text>
  <circle cx="748" cy="180" r="5" fill="#eb6834"/>
  <text x="762" y="184" font-size="12" font-weight="600" fill="#202124">Veto</text>
  <text x="762" y="201" font-size="11" fill="#5f6368">P(Yes) &lt; 0.2 blocks an answer</text>
  <circle cx="748" cy="234" r="5" fill="#2a78d6"/>
  <text x="762" y="238" font-size="12" font-weight="600" fill="#202124">Escalate to the 4B model</text>
  <text x="762" y="255" font-size="11" fill="#5f6368">uncertain majority, disagreement,</text>
  <text x="762" y="270" font-size="11" fill="#5f6368">vetoed leader, or stragglers</text>

  <line x1="990" y1="190" x2="1030" y2="190" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1036" y="168" width="104" height="44" rx="22" fill="#202124"/>
  <text x="1088" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Answer</text>
</svg>
