# Optional: a free-tier API model as the "big" escalation target.
# Remote calls have no device cost (wall-clock is network latency), so this model
# appears only on the FLOPs / eFLOPs panels, and only if `spec` is filled in from
# the model card. Respect each provider's rate limits (rpm) and terms; free tiers
# may log prompts.
output_dir: runs/t4_hybrid_math500     # share the bank directory with the T4 run
dataset: {name: math500, split: test, limit: 150, seed: 0}
sampling: {temperature: 0.7, top_p: 1.0, max_new_tokens: 1024}
bank: {samples_per_question: 8, wave_width: 8}
models:
  - tag: remote-big
    backend: openai
    model_id: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    supports_n: false
    max_concurrency: 2
    rpm: 25
    # spec: {params: ..., active_params: ..., n_layers: ..., n_heads: ..., n_kv_heads: ..., head_dim: ...}
